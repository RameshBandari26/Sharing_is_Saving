spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: update
server:
  port: ${PORT:9191}
  error:
    include-message: never
    include-binding-errors: never
app:
  cors-origin: ${CORS_ORIGIN:https://sharing-is-saving.vercel.app/}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-to-at-least-32-characters-long}
    ttl-hours: 24
geocoding:
  base-url: https://nominatim.openstreetmap.org
routing:
  base-url: https://router.project-osrm.org
